<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4ead8"><title>Khmer Flashcards</title><style>
:root{--bg:#f5efe4;--card:#fffaf2;--ink:#29251f;--muted:#776e62;--line:#ded2c0;--accent:#b45d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Khmer","PingFang TC",sans-serif}.wrap{max-width:520px;margin:auto;padding:22px 18px 40px}.top{display:flex;justify-content:space-between;align-items:end}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted)}h1{font-size:28px;margin:4px 0 0}.streak{font-size:13px;color:var(--muted)}.progress{height:5px;background:#e7ddce;border-radius:9px;margin:20px 0}.bar{height:100%;width:10%;background:var(--accent);border-radius:9px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.chip{border:1px solid var(--line);background:transparent;padding:8px 12px;border-radius:99px;white-space:nowrap;color:var(--ink)}.chip.on{background:var(--ink);color:white}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;min-height:410px;padding:30px 24px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:0 10px 35px #5c463314}.kh{font-size:52px;line-height:1.35}.roman{font-size:19px;color:var(--accent);margin-top:12px}.zh{font-size:26px;margin-top:16px}.example{border-top:1px solid var(--line);margin-top:28px;padding-top:20px;text-align:left;line-height:1.75}.small{font-size:13px;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}button{font:inherit}.act{padding:13px 8px;border-radius:15px;border:1px solid var(--line);background:#fffaf2}.bad{color:#9b4638}.good{color:#39714c}.footer{display:flex;justify-content:space-between;margin-top:20px}.link{border:0;background:none;color:var(--muted);padding:8px}.hidden{display:none}.quiz{margin-top:16px;background:#fffaf2;border:1px solid var(--line);border-radius:18px;padding:18px}.choice{display:block;width:100%;margin:8px 0;padding:11px;border:1px solid var(--line);border-radius:12px;background:white}
</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">每日高棉文</div><h1>KHMER CARDS</h1></div><div class="streak">🔥 <span id="streak">1</span> 天</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="filters" id="filters"></div><main class="card" id="card" onclick="toggleDetail()"><div class="small" id="cat"></div><div class="kh" id="kh"></div><div class="roman" id="roman"></div><div class="zh" id="zh"></div><div class="example hidden" id="detail"><b id="exkh"></b><br><span id="exro"></span><br><span id="exzh"></span><div class="small" id="parts" style="margin-top:10px"></div></div><div class="small" style="margin-top:22px">點卡片看例句</div></main><div class="actions"><button class="act bad" onclick="rate(0,event)">再練一次</button><button class="act" onclick="speak(event)">🔊 發音</button><button class="act good" onclick="rate(1,event)">我會了</button></div><div class="footer"><button class="link" onclick="prev()">← 上一張</button><button class="link" onclick="quiz()">小測驗</button><button class="link" onclick="next()">下一張 →</button></div><div class="quiz hidden" id="quiz"></div></div><script>
const cards=[
['日常','សួស្តី','suos-dei','你好','សួស្តី! សុខសប្បាយទេ?','Suos-dei! Sok sabai te?','你好！你還好嗎？','សួស្តី＝你好｜សុខសប្បាយ＝好、舒服｜ទេ＝嗎'],
['日常','អរគុណ','aw-kun','謝謝','អរគុណច្រើន។','Aw-kun chraen.','非常謝謝。','អរគុណ＝謝謝｜ច្រើន＝很多'],
['日常','បាទ','baat','是／好的（男性）','បាទ ខ្ញុំយល់ហើយ។','Baat, khnhom yol haey.','好的，我懂了。','ខ្ញុំ＝我｜យល់＝懂｜ហើយ＝了'],
['日常','ចាស','chaas','是／好的（女性）','ចាស ខ្ញុំយល់ហើយ។','Chaas, khnhom yol haey.','好的，我懂了。','女性常用的禮貌回答'],
['餐廳','ញ៉ាំ','nham','吃','ខ្ញុំចង់ញ៉ាំបាយ។','Khnhom jong nham bai.','我想吃飯。','ខ្ញុំ＝我｜ចង់＝想｜ញ៉ាំ＝吃｜បាយ＝飯'],
['餐廳','ឆ្ងាញ់','chnganh','好吃','ម្ហូបនេះឆ្ងាញ់ណាស់។','Mhop nih chnganh nas.','這道菜很好吃。','ម្ហូប＝菜餚｜នេះ＝這個｜ណាស់＝很'],
['餐廳','ទឹក','teuk','水','ខ្ញុំចង់បានទឹក។','Khnhom jong ban teuk.','我想要水。','ចង់បាន＝想要｜ទឹក＝水'],
['買東西','ថ្លៃ','thlai','貴','នេះថ្លៃពេក។','Nih thlai pek.','這個太貴了。','នេះ＝這個｜ថ្លៃ＝貴｜ពេក＝太'],
['買東西','ប៉ុន្មាន','pon-man','多少','នេះថ្លៃប៉ុន្មាន?','Nih thlai pon-man?','這個多少錢？','ថ្លៃ＝價格／貴｜ប៉ុន្មាន＝多少'],
['交通','ទៅ','tov','去','ខ្ញុំទៅផ្សារ។','Khnhom tov psar.','我去市場。','ខ្ញុំ＝我｜ទៅ＝去｜ផ្សារ＝市場'],
['交通','ឈប់','chhop','停','ឈប់ទីនេះ។','Chhop ti nih.','停在這裡。','ឈប់＝停｜ទីនេះ＝這裡'],
['方向','ឆ្វេង','chhveng','左邊','បត់ឆ្វេង។','Bat chhveng.','左轉。','បត់＝轉｜ឆ្វេង＝左'],
['方向','ស្តាំ','sdam','右邊','បត់ស្តាំ។','Bat sdam.','右轉。','បត់＝轉｜ស្តាំ＝右'],
['工作','ការងារ','ka-ngia','工作','ថ្ងៃនេះការងារច្រើន។','Thngai nih ka-ngia chraen.','今天工作很多。','ថ្ងៃនេះ＝今天｜ការងារ＝工作｜ច្រើន＝多'],
['時間','ថ្ងៃនេះ','thngai nih','今天','ថ្ងៃនេះខ្ញុំរវល់។','Thngai nih khnhom rovol.','我今天很忙。','ថ្ងៃ＝天｜នេះ＝這｜រវល់＝忙'],
['時間','ស្អែក','sa-aek','明天','ជួបគ្នាស្អែក។','Chuob knea sa-aek.','明天見。','ជួបគ្នា＝見面｜ស្អែក＝明天'],
['感受','សប្បាយ','sabbai','開心／舒服','ខ្ញុំសប្បាយចិត្ត។','Khnhom sabbai chet.','我很開心。','សប្បាយ＝開心｜ចិត្ត＝心'],
['感受','ហត់','hot','累','ថ្ងៃនេះខ្ញុំហត់។','Thngai nih khnhom hot.','我今天累了。','ថ្ងៃនេះ＝今天｜ខ្ញុំ＝我｜ហត់＝累'],
['實用','មិនអីទេ','min ey te','沒關係','មិនអីទេ។','Min ey te.','沒關係。','很常用的日常回應'],
['實用','ខ្ញុំមិនយល់ទេ','khnhom min yol te','我不懂','សូមនិយាយម្តងទៀត ខ្ញុំមិនយល់ទេ។','Som niyeay mdong tiet, khnhom min yol te.','請再說一次，我不懂。','សូម＝請｜និយាយ＝說｜ម្តងទៀត＝再一次']];
let idx=+localStorage.khidx||0, category='全部', learned=JSON.parse(localStorage.khlearned||'{}');
const filters=document.getElementById('filters'), cat=document.getElementById('cat'), kh=document.getElementById('kh'), roman=document.getElementById('roman'), zh=document.getElementById('zh'), exkh=document.getElementById('exkh'), exro=document.getElementById('exro'), exzh=document.getElementById('exzh'), parts=document.getElementById('parts'), detail=document.getElementById('detail'), bar=document.getElementById('bar');
const cats=['全部',...new Set(cards.map(x=>x[0]))];function list(){return category==='全部'?cards:cards.filter(x=>x[0]===category)}
function renderFilters(){filters.innerHTML=cats.map(c=>`<button class="chip ${c===category?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
function render(){let a=list();if(idx>=a.length)idx=0;let c=a[idx];cat.textContent=c[0]+' · '+(idx+1)+' / '+a.length;kh.textContent=c[1];roman.textContent=c[2];zh.textContent=c[3];exkh.textContent=c[4];exro.textContent=c[5];exzh.textContent=c[6];parts.textContent=c[7];detail.classList.add('hidden');bar.style.width=((idx+1)/a.length*100)+'%';localStorage.khidx=idx;renderFilters()}
function toggleDetail(){detail.classList.toggle('hidden')}function next(){idx=(idx+1)%list().length;render()}function prev(){idx=(idx-1+list().length)%list().length;render()}function setCat(c){category=c;idx=0;render()}function rate(v,e){e.stopPropagation();let c=list()[idx];learned[c[1]]=v;localStorage.khlearned=JSON.stringify(learned);next()}function speak(e){e.stopPropagation();let u=new SpeechSynthesisUtterance(list()[idx][1]);u.lang='km-KH';speechSynthesis.cancel();speechSynthesis.speak(u)}function quiz(){let q=document.getElementById('quiz');q.classList.toggle('hidden');if(q.classList.contains('hidden'))return;let c=list()[idx],opts=[c[3],...cards.filter(x=>x!==c).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[3])].sort(()=>Math.random()-.5);q.innerHTML=`<b>${c[1]}</b> 是什麼意思？`+opts.map(o=>`<button class="choice" onclick="this.textContent+=' ${o===c[3]?'✓':'✕'}'">${o}</button>`).join('')}
render();
</script></body></html>
